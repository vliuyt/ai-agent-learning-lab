<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">AI Agent 学习实验室</title>
  <desc id="description">8 周、40 天、160 项任务的中文 AI Agent 互动课程</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fff7df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f1d39" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1182" cy="-18" r="190" fill="#fbbf24" opacity="0.18"/>
  <circle cx="44" cy="612" r="142" fill="#fbbf24" opacity="0.14"/>

  <g transform="translate(72 60)">
    <rect width="48" height="48" rx="13" fill="#fbbf24"/>
    <circle cx="24" cy="24" r="8" fill="none" stroke="#11203d" stroke-width="4"/>
    <text x="64" y="34" fill="#11203d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700">AI Agent Lab</text>
  </g>

  <g transform="translate(72 158)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="0" y="0" fill="#a65f00" font-size="22" font-weight="700" letter-spacing="2">中文 · 项目驱动 · 完全互动</text>
    <text x="0" y="78" fill="#11203d" font-size="62" font-weight="800">8 周掌握 AI Agent</text>
    <text x="0" y="138" fill="#11203d" font-size="34" font-weight="650">从会用，到能构建、评测并改进</text>
    <text x="0" y="204" fill="#5d6b83" font-size="24">视频、播客、精读、实验与真实项目交错进行</text>

    <g transform="translate(0 252)">
      <rect width="132" height="74" rx="16" fill="#ffffff" stroke="#eadfca"/>
      <text x="22" y="34" fill="#11203d" font-size="26" font-weight="800">40 天</text>
      <text x="22" y="57" fill="#6b778d" font-size="15">可勾选日程</text>
      <rect x="150" width="150" height="74" rx="16" fill="#ffffff" stroke="#eadfca"/>
      <text x="172" y="34" fill="#11203d" font-size="26" font-weight="800">160 项</text>
      <text x="172" y="57" fill="#6b778d" font-size="15">实践任务</text>
      <rect x="318" width="150" height="74" rx="16" fill="#ffffff" stroke="#eadfca"/>
      <text x="340" y="34" fill="#11203d" font-size="26" font-weight="800">20 个</text>
      <text x="340" y="57" fill="#6b778d" font-size="15">核心概念</text>
    </g>
  </g>

  <g transform="translate(790 154) rotate(-2 210 168)" filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="-18" y="-18" width="420" height="336" rx="34" fill="#11203d" transform="rotate(5 192 150)"/>
    <rect width="420" height="336" rx="34" fill="#fbbf24"/>
    <g fill="#11203d" opacity="0.45"><circle cx="28" cy="28" r="5"/><circle cx="46" cy="28" r="5"/><circle cx="64" cy="28" r="5"/></g>
    <text x="292" y="35" fill="#72500b" font-size="13" font-weight="700" letter-spacing="2">AGENT LOOP</text>
    <text x="34" y="105" fill="#11203d" font-size="18" font-weight="700">NOW LEARNING</text>
    <text x="34" y="158" fill="#11203d" font-size="38" font-weight="800">Agent Loop</text>
    <text x="34" y="198" fill="#61470e" font-size="19">观察、判断、行动、再观察。</text>
    <g transform="translate(34 248)" fill="#11203d" font-size="13" font-weight="800" text-anchor="middle">
      <rect width="100" height="46" rx="12" fill="#fff4ca"/><text x="50" y="29">OBSERVE</text>
      <rect x="110" width="100" height="46" rx="12" fill="#fff4ca"/><text x="160" y="29">DECIDE</text>
      <rect x="220" width="100" height="46" rx="12" fill="#fff4ca"/><text x="270" y="29">ACT</text>
    </g>
  </g>
</svg>
